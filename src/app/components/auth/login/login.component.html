<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <img src="assets/layout/images/{{layoutService.config().colorScheme === 'light' ? 'logo-dark' : 'logo-white'}}.png" alt="Cratos logo" class="mb-5 w-6rem flex-shrink-0">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <img src="assets/demo/images/login/avatar.png" alt="Image" height="50" class="mb-3">
                    <div class="text-900 text-3xl font-medium mb-3">Bem Vindo!</div>
                    <span class="text-600 font-medium">Entre para continuar</span>
                </div>

                <div>
                    <label for="usuario" class="block text-900 text-xl font-medium mb-2">Usuário</label>
                    <input id="usuario" type="text" placeholder="Nome do usuário" pInputText class="w-full md:w-30rem mb-5" style="padding:1rem" [(ngModel)]="auth.user">

                    <label for="password" class="block text-900 font-medium text-xl mb-2">Senha</label>
                    <p-password id="password" [(ngModel)]="auth.password" placeholder="Senha" [toggleMask]="true" (keyup.enter)="login()" [feedback]="false" styleClass="mb-5" inputStyleClass="w-full p-3 md:w-30rem"></p-password>

                    <div class="flex align-items-center justify-content-between mb-5 gap-5" >
                        <div class="flex align-items-center" *ngIf="exibirLembreMe">
                            <p-checkbox id="rememberme1" [(ngModel)]="auth.endActiveSessions" [binary]="true" styleClass="mr-2"></p-checkbox>
                            <label for="rememberme1">Lembre de mim</label>
                        </div>
                        <a class="font-medium no-underline ml-2 text-right cursor-pointer" style="color: var(--primary-color)" *ngIf="exibirLembreMe">Esqueci minha senha.</a>
                    </div>
                    <button pButton pRipple label="Entrar" class="w-full p-3 text-xl" (click)="login()"></button>
                </div>
            </div>
        </div>
    </div>

    <p-toast></p-toast>
</div>
